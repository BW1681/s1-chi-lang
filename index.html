<style>

.input-row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}

.praise{pointer-events:none;position:absolute;left:50%;top:8%;transform:translateX(-50%) scale(.7);z-index:8;text-align:center;min-width:55%;animation:praisePop 1.7s cubic-bezier(.2,1.2,.3,1) forwards;opacity:0}

@keyframes praisePop{0%{opacity:0;transform:translateX(-50%) scale(.5)}18%{opacity:1;transform:translateX(-50%) scale(1.06)}70%{opacity:1}100%{opacity:0;transform:translateX(-50%) translateY(-10px) scale(.95)}}
.card.celeb{box-shadow:0 0 0 4px rgba(196,92,38,.55),0 16px 0 rgba(0,0,0,.18),0 28px 60px rgba(0,0,0,.35)}

.report-sum{margin:8px 0;padding:12px;border-radius:14px;background:linear-gradient(180deg,#e6fcf5,#c3fae8);border:2px solid #0b9b6b;font-weight:900;color:#134e4a}

.foot{text-align:center;font-size:12px;color:#e8c49a;opacity:.85;padding:8px 16px 24px}
.hidden{display:none!important}

#gate{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;

.gate-card{width:100%;max-width:380px;padding:22px 20px 20px;border-radius:22px;

.gate-card h2{margin:0 0 6px;font-size:22px;color:#7a2e12}
.gate-card .hint{margin:0 0 14px;font-size:13.5px;font-weight:700;color:#a33b24}
.gate-card input{width:100%;font-size:18px;padding:12px 14px;border-radius:12px;border:3px solid #c45c26;

</style>

s": 2, "hint": ""}, {"kind": "mc", "sec": "擬聲", "q": "詩中「孜孜」「喃喃」「啁啾」都是？", "opts": ["反語", "擬聲詞", "對偶句", "量詞"], "ans": 1, "hint": ""}, {"kind": "tf", "sec": "情節", "q": "雛燕長大後仍長留巢中反哺雙親。", "ans": false, "hint": "四散飛走，不回顧"}, {"kind": "mc", "sec": "主旨", "q": "第2段（「燕燕爾勿悲」起）主要作用是？", "opts": ["繼續描寫築巢細節", "勸誡、點明盡孝體諒父母", "寫燕子遷徙路線", "介紹唐詩格律"], "ans": 1, "hint": ""}, {"kind": "input", "sec": "詞義", "q": "「須臾」的意思是____的時間。", "ans": "很短", "accept": ["很短", "片刻", "短", "極短", "很短的"], "hint": ""}, {"kind": "mc", "sec": "主旨", "q": "本詩借燕寫人，主要勸人？", "opts": ["爭取功名", "盡孝、體諒父母", "遠遊四方", "學習對偶"], "ans": 1, "hint": ""}]}, {"id": "r-ciwu", "title": "《慈烏夜啼》", "author": "白居易", "emoji": "🐦‍⬛", "kind": "文言古體詩", "note": "全首背誦 · 公開領域", "passage": "慈烏失其母，啞啞吐哀音。\n晝夜不飛去，經年守故林。\n夜夜夜半啼，聞者為沾襟。\n聲中如告訴，未盡反哺心。\n百鳥豈無母，爾獨哀怨深。\n應是母慈太重，使爾悲不任。\n昔有吳起者，母歿喪不臨。\n嗟哉斯徒輩，其心不如禽。\n慈烏復慈烏，鳥中之曾參。", "questions": [{"kind": "mc", "sec": "反哺", "q": "「反哺」比喻？", "opts": ["子女奉養父母", "父母遺棄子女", "朋友互相幫助", "師生問答"], "ans": 0, "hint": ""}, {"kind": "input", "sec": "擬聲", "q": "詩中慈烏哀鳴的擬聲詞是____。", "ans": "啞啞", "accept": ["啞啞"], "hint": ""}, {"kind": "mc", "sec": "反例", "q": "詩中不孝的反例是誰？", "opts": ["曾參", "吳起", "孔子", "莊子"], "ans": 1, "hint": "母歿喪不臨"}, {"kind": "mc", "sec": "比喻", "q": "作者把慈烏比作鳥中的？", "opts": ["吳起", "曾參", "惠子", "岳飛"], "ans": 1, "hint": ""}, {"kind": "tf", "sec": "主旨", "q": "本詩讚孝、諷不孝，勸世人盡孝。", "ans": true, "hint": ""}, {"kind": "mc", "sec": "詞義", "q": "「沾襟」意思接近？", "opts": ["衣襟乾燥", "淚濕衣襟", "整理羽毛", "飛離樹林"], "ans": 1, "hint": ""}]}, {"id": "r-niao", "title": "《鳥鳴澗》", "author": "王維", "emoji": "🌙", "kind": "五言絕句", "note": "公開領域", "passage": "人閒桂花落，夜靜春山空。\n月出驚山鳥，時鳴春澗中。", "questions": [{"kind": "mc", "sec": "體裁", "q": "本詩體裁是？", "opts": ["七言律詩", "五言絕句", "詞", "新詩"], "ans": 1, "hint": "四句，每句五字"}, {"kind": "mc", "sec": "作者", "q": "王維人稱？", "opts": ["詩仙", "詩聖", "詩佛", "詩鬼"], "ans": 2, "hint": ""}, {"kind": "mc", "sec": "手法", "q": "「月出驚山鳥，時鳴春澗中」主要是？", "opts": ["以動襯靜", "反語", "誇飾數字", "設問"], "ans": 0, "hint": ""}, {"kind": "mc", "sec": "「空」", "q": "結合詩境，「 function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function norm(s){
  return String(s||"").trim().toLowerCase()
    .replace(/[\s\u3000]+/g,"")
    .replace(/[\u3002\uFF0E\uFF0C,\u3001\uFF01!\uFF1F?\uFF1A:\uFF1B;\uFF08\uFF09()\u300C\u300D\u300E\u300F\u300A\u300B\u3008\u3009"'']/g,"");
}
function matchInput(raw, item){
  const n = norm(raw);
  if(!n) return false;
  const list = [item.ans].concat(item.accept||[]);
  return list.some(a => {
    const na = norm(a);
    return na === n || na.includes(n) || n.includes(na);
  });
}
function correctText(item){
  if(item.kind==="tf") return item.ans ? "正確" : "錯誤";
  if(item.kind==="mc") return (item.opts&&item.opts[item.ans]!=null)?item.opts[item.ans]:String(item.ans);
  return item.ans;
}
function kindLabel(item){
  if(item.kind==="mc") return "選擇";
  if(item.kind==="tf") return "是非";
  if(item.kind==="input") return "填充";
  return item.kind||"";
}
function itemMarks(item){ return (item.marks!=null?item.marks:1); }
function countChapter(ch){ return ch.levels.reduce((a,lv)=>a+lv.length,0); }
function countBank(){
  let n = CHAPTERS.reduce((a,ch)=>a+countChapter(ch),0);
  n += BASICS.reduce((a,b)=>a+b.questions.length,0);
  n += READINGS.reduce((a,r)=>a+r.questions.length,0);
  n += TEST_PAPERS.reduce((a,t)=>a+t.questions.length,0);
  return n;
}
function fmtTime(ms){
  const s=Math.floor(ms/1000); const m=Math.floor(s/60); const r=s%60;
  return m+":"+String(r).padStart(2,"0");
}

function updateProg(){

function celebrate(){
  const fx=document.getElementById("fx"); if(!fx) return;
  fx.innerHTML="";
  const bits=["🧧","✨","🎋","📜","🌟","💮","🎉","🖌️"];
  for(let i=0;i<18;i++){
    const d=document.createElement("div"); d.className="bit";
    d.textContent=bits[i%bits.length];

  }

    card.appendChild(p);

  }
}
function mixMc(item){
  const labels=item.opts.slice();
  const correctLabel=labels[item.ans];
  for(let i=labels.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [labels[i],labels[j]]=[labels[j],labels[i]]; }
  return { labels, correct: labels.indexOf(correctLabel) };
}
function shuffle(arr){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

function afterCorrect(userAns){
  const item=paper.questions[qi];

  if(firstTry){

    else score += pts;
  }

    ? ("得分 "+score+" / "+totalPts+(bonusPts?(" (+"+bonusScore+" 加分)"):""))
    : ("得分 "+score);
  log.push({
    no:qi+1, sec:item.sec||"", kind:item.kind, q:item.q,
    ch:item._ch||"", lv:item._lv||"", chTitle:item._chTitle||"",
    ok:firstTry, ptsGot:pts, ptsMax:mk, bonus:!!item.bonus,
    correct:correctText(item), userAns:userAns||"", firstTry:firstTry
  });
  locked=true;
  const totLine = (paper.mode==="test")
    ? ("得分 "+score+" / "+totalPts+(bonusPts?(" · 加分 "+bonusScore+" / "+bonusPts):""))
    : ("合計 "+score+" / "+totalPts);
  document.getElementById("why").textContent = firstTry
    ? ("答對！+"+(item.bonus?pts+" 加分":pts+" 分")+"。"+totLine+"。")
    : ("改啱喇！第一次唔中，今題 0 分。"+totLine+"。");
  if(firstTry) celebrate();
  const last = qi+1 >= paper.questions.length;
  const nxt=document.getElementById("next");
  nxt.style.display="block";
  nxt.textContent = last ? "睇成績" : "下一題";
  nxt.onclick=()=>goNext();

function answerMc(idx, btn){
  if(locked || !paper) return;
  const ok = idx === curMc.correct;
  document.querySelectorAll("#opts .opt").forEach(b=>b.classList.remove("picked"));
  btn.classList.add("picked");
  if(ok){
    document.querySelectorAll("#opts .opt").forEach(b=>b.disabled=true);
    btn.classList.add("good");
    afterCorrect(curMc.labels[idx]);
  } else {
    btn.classList.add("bad");
    btn.disabled=true;
    firstTry=false;
    document.getElementById("why").textContent="未啱——再試過。要答啱先至可以去下一題。（今題已無分）";
    const card=document.getElementById("card");

function answerInput(){
  if(locked || !paper) return;
  const item=paper.questions[qi];
  const input=document.getElementById("fillAns");
  const raw=input?input.value:"";
  if(!norm(raw)){ document.getElementById("why").textContent="請先輸入答案。"; return; }
  const ok=matchInput(raw, item);
  if(ok){
    if(input) input.disabled=true;
    document.querySelectorAll("#opts .go").forEach(b=>b.disabled=true);
    afterCorrect(raw.trim());
  } else {
    firstTry=false;
    document.getElementById("why").textContent="未啱——再試過。提示："+(item.hint||"睇返課本重點")+"（今題已無分）";
    const card=document.getElementById("card");
    if(card){ card.style.animation="shake .35s ease"; setTimeout(()=>card.style.animation="",400); }
    if(input){ input.select(); }
  }
}

function goNext(){
  if(qi+1 >= paper.questions.length){ settle(false); return; }
  qi++; showQ();
}

function analyze(logArr){
  const bySec={};
  logArr.forEach(e=>{
    const k=e.sec||"其他";
    if(!bySec[k]) bySec[k]={ok:0,n:0};
    bySec[k].n++; if(e.ok) bySec[k].ok++;
  });
  const rows=Object.keys(bySec).map(k=>{
    const r=bySec[k]; const pct=r.n?Math.round(r.ok/r.n*100):0;
    return {sec:k, pct, ok:r.ok, n:r.n};
  }).sort((a,b)=>b.pct-a.pct);
  const strong=rows.filter(r=>r.pct>=70).slice(0,3);
  const weak=rows.filter(r=>r.pct<70).sort((a,b)=>a.pct-b.pct).slice(0,3);
  const wrongs=logArr.filter(e=>!e.ok);
  return {strong, weak, wrongs, rows};
}

function settle(early){
  stopTimer();
  elapsedMs = Date.now()-startAt;
  locked=true;
  document.getElementById("btnSettle").style.display="none";
  if(early){
    for(let i=log.length;i<paper.questions.length;i++){
      const qq=paper.questions[i];
      log.push({no:i+1, sec:qq.sec||"", kind:qq.kind, q:qq.q, ch:qq._ch||"", lv:qq._lv||"", chTitle:qq._chTitle||"",
        ok:false, ptsGot:0, ptsMax:itemMarks(qq), bonus:!!qq.bonus, correct:correctText(qq), userAns:"", firstTry:false, skipped:true});
    }
  }
  const pct = totalPts ? Math.round(score/totalPts*100) : 0;
  const correctN = log.filter(e=>e.ok && !e.bonus).length;
  const totalN = log.filter(e=>!e.bonus).length;
  const bonusOk = log.filter(e=>e.ok && e.bonus).length;
  const bonusN = log.filter(e=>e.bonus).length;
  document.getElementById("ptitle").textContent=paper.name+" · 成績";
  document.getElementById("where").textContent="用時 "+fmtTime(elapsedMs)+(early?" · 提早結束":" · 已完成");
  document.getElementById("scoreHint").textContent="向下捲睇分析同正解";
  document.getElementById("progFill").style.width="100%";

  let encourage;
  if(pct>=90) encourage="🌟 好勁！語文根基好穩陣！";
  else if(pct>=75) encourage="👏 好叻！繼續保持！";
  else if(pct>=60) encourage="💪 合格有餘——薄弱位再練就更穩！";
  else if(pct>=40) encourage="🌈 已有基礎——睇錯題同課本重點再衝！";
  else encourage="🌱 唔好放棄——溫一溫重點再挑戰！";

  const A=analyze(log);
  let html="";
  if(early) html+='<div class="report-banner">⏹ 提早結束——未答題目當 0 分。</div>';
  if(paper.mode==="test"){
    html+='<div class="report-sum"><strong>得分 '+score+' / '+totalPts+'</strong>（'+pct+'%）';
    if(bonusPts) html+=' · <strong>加分 '+bonusScore+' / '+bonusPts+'</strong>（額外；唔計入必得分）';
    html+=' · 首次答對 '+correctN+' / '+totalN+(bonusN?(' · 加分題 '+bonusOk+' / '+bonusN):'')+' · 用時 '+fmtTime(elapsedMs)+'</div>';
    html+='<div class="report-note">分析以第一次作答結果計算。</div>';
  } else {
    html+='<div class="report-sum"><strong>得分 '+score+' / '+totalPts+'</strong>（'+pct+'%） · 首次答對 '+correctN+' / '+totalN+' · 用時 '+fmtTime(elapsedMs)+'</div>';
  }
  html+='<div class="report-encourage">'+encourage+'</div>';

  html+='<div class="analysis"><strong>📊 學習分析</strong><br>';
  if(A.strong.length){
    html+='強項：'+A.strong.map(r=>esc(r.sec)+'（'+r.pct+'%）').join('、')+'<br>';
  } else html+='強項：暫時未有課題達 70%+——繼續加油！<br>';
  if(A.weak.length){
    html+='宜溫習：'+A.weak.map(r=>esc(r.sec)+'（'+r.pct+'%）').join('、')+'<br>';
  } else html+='宜溫習：各課題較平均——保持！<br>';
  if(A.wrongs.length){
    html+='錯題：有 '+A.wrongs.length+' 題第一次未中——見下方回顧。';
  } else html+='錯題：全部第一次答對——好嘢！';
  html+='</div>';

  html+='<p class="report-note">下列為正確答案，並對照你的作答（✓＝第一次得分）。</p>';
  html+='<div><strong>📖 題目回顧與正解</strong></div>';
  log.forEach(e=>{
    const tag = e.ok ? "ok" : "ng";
    html+='<div class="report-item '+tag+'"><strong>第'+e.no+'題</strong>';
    if(e.bonus) html+=' <span class="bonus-tag">加分</span>';
    if(e.ch) html+=' [單元'+e.ch+(e.lv?(' 第'+e.lv+'關'):'')+']';
    if(e.sec) html+=' '+esc(e.sec);
    html+='<br>'+esc((e.q||"").length>70?(e.q.slice(0,70)+"…"):(e.q||""));
    html+='<br>正解：<strong>'+esc(e.correct||"—")+'</strong>';
    if(e.skipped) html+='　你的答案：（略過）';
    else if(!e.ok) html+='　你的答案：'+esc(e.userAns||"（多次後改啱／未記錄）");
    else html+='　你的答案：'+esc(e.userAns||"✓");
    html+='　'+(e.ok?("✓ +"+e.ptsGot+(e.bonus?" 加分":" 分")):"✗ 0 分");
    html+='</div>';
  });

  document.getElementById("q").innerHTML=html;
  document.getElementById("why").textContent="";
  const box=document.getElementById("opts"); box.innerHTML="";
  const nxt=document.getElementById("next"); nxt.style.display="none"; nxt.onclick=null;
  if(pct>=75) celebrate();
  const card=document.getElementById("card"); if(card) card.scrollTop=0;

  function add(label, fn){
    const b=document.createElement("button");
    b.className="opt"; b.type="button"; b.textContent=label; b.onclick=fn;
    box.appendChild(b);
  }
  const finishedPaper = paper;
  add("再試一次", ()=>{
    closePanel();
    if(finishedPaper && finishedPaper.mode==="combo") startCombo();
    else if(finishedPaper && finishedPaper.mode==="test"){
      const tp = TEST_PAPERS.find(t=>t.id===finishedPaper.testPaperId);
      if(tp) startTestPaper(tp); else renderTestList();
    } else if(finishedPaper && finishedPaper.mode==="basics"){
      const topic = BASICS.find(t=>t.id===finishedPaper.basicsId);
      if(topic) beginPaper({ name: "基礎 · "+topic.title, en: topic.title, questions: topic.questions.map(q=>Object.assign({},q)), mode: "basics", unit: topic.title, basicsId: topic.id });
      else renderBasicsList();
    } else if(finishedPaper && finishedPaper.mode==="reading"){
      const r = READINGS.find(x=>x.id===finishedPaper.readingId);
      if(r) startReading(r); else renderReadingList();
    } else if(curCh){
      const idx=CHAPTERS.indexOf(curCh);
      renderLevels(curCh, idx>=0?idx:0);
    } else renderHome();
  });
  const backLabel = finishedPaper && finishedPaper.mode==="test" ? "返回測驗卷一覽" :
      finishedPaper && finishedPaper.mode==="basics" ? "返回基礎知識" :
      finishedPaper && finishedPaper.mode==="reading" ? "返回閱讀理解" : "返回主頁";
  add(backLabel, ()=>{
    closePanel();
    if(finishedPaper && finishedPaper.mode==="test") renderTestList();
    else if(finishedPaper && finishedPaper.mode==="basics") renderBasicsList();
    else if(finishedPaper && finishedPaper.mode==="reading") renderReadingList();
    else renderHome();
  });
  if(finishedPaper && (finishedPaper.mode==="test"||finishedPaper.mode==="basics"||finishedPaper.mode==="reading")){
    add("返回主頁", ()=>{ closePanel(); renderHome(); });
  }

  try{
    P5Platform.report({
      gameId: GAME_ID, game:"中國語文島 · 中一上", mode: paper.mode||"level",
      lesson: paper.name||"", detail: paper.unit||"",
      score: score, maxScore: totalPts, bonusScore: bonusScore, pct: pct, ms: elapsedMs,
      player: getNick()||undefined
    });
  }catch(e){}

  try{
    const st=loadStore();
    st.last={ name:paper.name, score, totalPts, pct, ms:elapsedMs, at:Date.now() };
    st.history=st.history||[];
    st.history.unshift(st.last);
    st.history=st.history.slice(0,30);
    saveStore(st);
  }catch(e){}
}

document.getElementById("btnBack").onclick=()=>{
  if(!paper){ closePanel(); return; }
  if(confirm("離開會失去今次進度。確定返回？")){
    const m = paper.mode;
    closePanel();
    if(m==="test") renderTestList();
    else if(m==="basics") renderBasicsList();
    else if(m==="reading") renderReadingList();
    else if(curCh){ const idx=CHAPTERS.indexOf(curCh); renderLevels(curCh, idx>=0?idx:0);}
    else renderHome();
  }
};
document.getElementById("btnSettle").onclick=()=>{
  if(!paper) return;
  if(confirm("提早結束？未答題目當 0 分。")) settle(true);
};

function gateUnlocked(){
  try{ return sessionStorage.getItem(GATE_KEY)==="1"; }catch(e){ return false; }
}
function markGateUnlocked(){
  try{ sessionStorage.setItem(GATE_KEY,"1"); }catch(e){}
}
function hideGate(){
  const g=document.getElementById("gate");
  if(g) g.classList.add("pass-ok");
}
function showGateError(msg){
  const el=document.getElementById("gateErr");
  if(el) el.textContent=msg||"";
}
function tryGateUnlock(){
  const inp=document.getElementById("gatePass");
  const raw=inp?String(inp.value||""):"";
  if(raw===GATE_CODE){
    markGateUnlocked();
    hideGate();
    showGateError("");
    renderHome();
  } else {
    showGateError("密碼不正確。");
    if(inp){ inp.value=""; inp.focus(); }
  }
}
function boot(){
  if(gateUnlocked()){
    hideGate();
    renderHome();
    return;
  }
  const enter=document.getElementById("gateEnter");
  const inp=document.getElementById("gatePass");
  if(enter) enter.onclick=tryGateUnlock;
  if(inp){
    inp.addEventListener("keydown", e=>{ if(e.key==="Enter"){ e.preventDefault(); tryGateUnlock(); }});
    setTimeout(()=>inp.focus(), 50);
  }
}
boot();

</script>
</body>
</html>
